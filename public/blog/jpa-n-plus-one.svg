<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c2d12"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#fff" fill-opacity=".12"/></pattern>
  </defs>
  <rect width="700" height="400" fill="url(#g)"/>
  <rect width="700" height="400" fill="url(#dots)"/>
  <circle cx="620" cy="-20" r="170" fill="#fff" fill-opacity=".07"/>
  <circle cx="60" cy="420" r="140" fill="#fff" fill-opacity=".06"/>
