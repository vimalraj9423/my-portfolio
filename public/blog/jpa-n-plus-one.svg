    <text x="22" y="36" font-size="14" fill="#fdba74" font-family="ui-monospace,Menlo,monospace">✗ N+1 queries</text>
    <text x="22" y="64" font-size="12" fill="#e2e8f0" font-family="ui-monospace,Menlo,monospace">SELECT * FROM orders</text>
    <g transform="translate(22,90)"><text x="0" y="0" font-size="12" fill="#fca5a5" font-family="ui-monospace,Menlo,monospace">SELECT * FROM items WHERE order_id=1</text><text x="0" y="22" font-size="12" fill="#fca5a5" font-family="ui-monospace,Menlo,monospace">SELECT * FROM items WHERE order_id=2</text><text x="0" y="44" font-size="12" fill="#fca5a5" font-family="ui-monospace,Menlo,monospace">SELECT * FROM items WHERE order_id=3</text><text x="0" y="66" font-size="12" fill="#fca5a5" font-family="ui-monospace,Menlo,monospace">SELECT * FROM items WHERE order_id=4</text><text x="0" y="88" font-size="12" fill="#fca5a5" font-family="ui-monospace,Menlo,monospace">SELECT * FROM items WHERE order_id=5</text><text x="0" y="110" font-size="12" fill="#fca5a5" font-family="ui-monospace,Menlo,monospace">SELECT * FROM items WHERE order_id=6</text><text x="0" y="132" font-size="12" fill="#fca5a5" font-family="ui-monospace,Menlo,monospace">SELECT * FROM items WHERE order_id=7</text></g>
    <text x="22" y="270" font-size="12" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace">… ×N</text>
