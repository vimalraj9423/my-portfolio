    <text x="20" y="64" font-size="12" fill="#0b1220" font-family="ui-monospace,Menlo,monospace">@EntityGraph(</text>
    <text x="20" y="86" font-size="12" fill="#0b1220" font-family="ui-monospace,Menlo,monospace">  attributePaths="items")</text>
    <text x="20" y="116" font-size="12" fill="#64748b" font-family="ui-monospace,Menlo,monospace">1 query</text>
  </g>
  <g transform="translate(480,250)"><ellipse cx="40" cy="12" rx="40" ry="12" fill="#fff"/><path d="M0 12 v50 a40 12 0 0 0 80 0 v-50" fill="#fff" fill-opacity=".85"/><ellipse cx="40" cy="12" rx="40" ry="12" fill="#fff" fill-opacity=".35"/><path d="M0 37 a40 12 0 0 0 80 0" fill="none" stroke="#fff" stroke-opacity=".5"/></g>

